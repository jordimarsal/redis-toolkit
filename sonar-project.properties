# SonarQube scanner defaults — picked up automatically by
# ~/homelab/sonarqube/analyze.sh when the scanner runs from the repo root.
# CLI -D flags override these, so this file is the single place to tune the scan.
#
# Run `mvn test` first: the Java analyzer needs the module bytecode and the
# JaCoCo XML reports that the build leaves under <module>/target/site/jacoco/.
sonar.projectKey=jordimarsal:redis-toolkit
sonar.sourceEncoding=UTF-8

# Explicitly include everything: the scanner CLI leaves sources empty when
# only sonar.tests is set. Tests are re-categorised via sonar.test.inclusions
# so src/test/java is not indexed twice.
sonar.sources=.
sonar.test.inclusions=**/src/test/java/**

# Java multi-module bytecode (full rule set + coverage import need it).
sonar.java.binaries=gateway-demo/target/classes,gateway-demo/target/test-classes,jobqueue-core/target/classes,jobqueue-core/target/test-classes,jobqueue-infra/target/classes,jobqueue-infra/target/test-classes,ratelimit-api/target/classes,ratelimit-api/target/test-classes,ratelimit-core/target/classes,ratelimit-core/target/test-classes,ratelimit-infra/target/classes,ratelimit-infra/target/test-classes

# Coverage: one JaCoCo XML per module, generated by `mvn test`.
sonar.coverage.jacoco.xmlReportPaths=gateway-demo/target/site/jacoco/jacoco.xml,jobqueue-core/target/site/jacoco/jacoco.xml,jobqueue-infra/target/site/jacoco/jacoco.xml,ratelimit-api/target/site/jacoco/jacoco.xml,ratelimit-core/target/site/jacoco/jacoco.xml,ratelimit-infra/target/site/jacoco/jacoco.xml

# Generated/config files. This list replaces the scanner's default exclusions
# entirely, so the standard build-output patterns are kept here too.
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/target/**,**/.git/**,**/.venv/**,**/venv/**,**/__pycache__/**,**/vendor/**,**/coverage/**,**/deploy/**
