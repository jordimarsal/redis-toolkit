services:
  redis:
    # Pinned by digest so the tag cannot drift under us.
    image: redis:7@sha256:71da9275c5f3fcb97d0fa0c8c5b36cc995327265420f17a04bfd544f458059f7
    command: ["sh", "-c", "exec redis-server --requirepass \"$${REDIS_PASSWORD}\""]
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:-redis-dev-password}"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 2s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
    networks: [frontend]

  gateway:
    build: .
    ports:
      - "8080:8080"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD:-redis-dev-password}"
      GATEWAY_PORT: "8080"
      BACKEND: ${BACKEND:-stub}
      LLM_BASE_URL: https://llama-tls:8443/v1
      # Optional path (inside the container) to a PKCS12/JKS keystore with the CA that signed
      # the llama-server certificate; leave empty for Java's default trust store.
      LLM_TRUSTSTORE: ${LLM_TRUSTSTORE:-}
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
    networks: [frontend]

  llama-server:
    image: ghcr.io/ggml-org/llama.cpp:server@sha256:3d03a6c6e02f6bb13c3b441bed420fa99c853d5ffd474112a1de7d9a0457d6bc
    profiles: ["llama"]
    volumes:
      - ./models:/models:ro
    command: ["--model", "/models/model.gguf"]
    # No memory limit on purpose: inference needs as much RAM as the model demands — tune per model.
    # Backend network only: unreachable from gateway/redis, so the Caddy TLS terminator is the sole entry point.
    networks: [backend]

  # TLS terminator so the gateway can reach llama-server over https (it enforces https-only URLs).
  # Self-signed internal certificate; for real deployments put your own reverse proxy here.
  llama-tls:
    image: caddy:2-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    profiles: ["llama"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - llama-server
    deploy:
      resources:
        limits:
          memory: 128M
    networks: [frontend, backend]

networks:
  frontend:
  backend:
