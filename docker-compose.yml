services:
  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 5

  gateway:
    build: .
    ports:
      - "8080:8080"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      GATEWAY_PORT: "8080"
      BACKEND: ${BACKEND:-stub}
      LLM_BASE_URL: https://llama-tls:8443/v1
      # Optional path (inside the container) to a PKCS12/JKS keystore with the CA that signed
      # the llama-server certificate; leave empty for Java's default trust store.
      LLM_TRUSTSTORE: ${LLM_TRUSTSTORE:-}
    depends_on:
      redis:
        condition: service_healthy

  llama-server:
    image: ghcr.io/ggml-org/llama.cpp:server
    profiles: ["llama"]
    volumes:
      - ./models:/models
    command: ["--model", "/models/model.gguf"]

  # TLS terminator so the gateway can reach llama-server over https (it enforces https-only URLs).
  # Self-signed internal certificate; for real deployments put your own reverse proxy here.
  llama-tls:
    image: caddy:2-alpine
    profiles: ["llama"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - llama-server
