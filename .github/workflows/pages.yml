name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/quality/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy the quality page
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      # enablement cannot create the Pages site from the workflow token on the
      # first run (admin-only); it was created once with:
      #   gh api -X POST repos/jordimarsal/redis-toolkit/pages -f build_type=workflow
      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/quality

      - id: deployment
        uses: actions/deploy-pages@v5
